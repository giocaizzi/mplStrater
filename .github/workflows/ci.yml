name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    needs: [test, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          R_TEST: ${{ needs.test.result }}
          R_SECRETS: ${{ needs.secrets.result }}
        run: |
          echo "test: $R_TEST, secrets: $R_SECRETS"
          [ "$R_TEST" = success ] && [ "$R_SECRETS" = success ]
